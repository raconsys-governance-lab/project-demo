name: Release Logger

on:
  push:
    branches:
      - main

jobs:
  release-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Release Log
        run: |
          echo "==================================" > release-log.txt
          echo "         RELEASE REPORT" >> release-log.txt
          echo "==================================" >> release-log.txt
          echo "" >> release-log.txt

          echo "Run Number: ${{ github.run_number }}" >> release-log.txt
          echo "Date: $(date -u)" >> release-log.txt
          echo "Event: ${{ github.event_name }}" >> release-log.txt
          echo "" >> release-log.txt

          echo "Repository: ${{ github.repository }}" >> release-log.txt
          echo "Branch: ${{ github.ref_name }}" >> release-log.txt
          echo "Author: ${{ github.actor }}" >> release-log.txt
          echo "" >> release-log.txt

          echo "Commit SHA:" >> release-log.txt
          echo "${{ github.sha }}" >> release-log.txt
          echo "" >> release-log.txt

          echo "Commit Message:" >> release-log.txt
          git log -1 --pretty=%B >> release-log.txt
          echo "" >> release-log.txt

          echo "Files Changed:" >> release-log.txt
          git diff-tree --no-commit-id --name-only -r ${{ github.sha }} >> release-log.txt
          echo "" >> release-log.txt

          echo "Workflow URL:" >> release-log.txt
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> release-log.txt

      - name: Display Log
        run: |
          cat release-log.txt

      - name: Upload Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-log-run-${{ github.run_number }}
          path: release-log.txt
          retention-days: 30
